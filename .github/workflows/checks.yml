name: Toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node esp32/tests/web_ui_test.cjs
      - run: c++ -std=c++17 esp32/tests/sequence_test.cpp -o /tmp/tv-sequence-test && /tmp/tv-sequence-test
      - run: python tools/check_public.py
